name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Static compile check
        run: python -m compileall src

      - name: Synthetic training smoke test
        run: python -m src.smoke --samples 8

      - name: CLI surface smoke
        run: |
          python -m src.train --help
          python -m src.evaluate --help
          python -m src.infer --help
          python -m src.business_metrics --help
          python -m src.monitoring --help
          python -m src.simulate_realtime --help
